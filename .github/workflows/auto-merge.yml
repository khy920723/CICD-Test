# 워크플로 이름 (Actions 탭에 표시됨)
name: PR Check and Merge to dev

# 언제 실행할지: dev 브랜치를 "대상"으로 하는 PR이 생기거나 업데이트될 때
on:
  pull_request:
    branches:
      - dev          # base(목적지)가 dev인 PR에만 반응 (feat/** → dev PR)

# 이 워크플로가 PR을 병합하려면 필요한 권한
permissions:
  contents: write        # 병합(코드 쓰기)에 필요
  pull-requests: write   # PR 조작에 필요

jobs:

  # 1번째 job: 검증 & 테스트
  test:
    runs-on: ubuntu-latest        # 우분투 가상 머신에서 실행
    steps:
      # PR의 코드를 가상 머신으로 내려받음
      - name: Checkout
        uses: actions/checkout@v4

      # 자바 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 리눅스에서 gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 실제 빌드 + 테스트. 실패하면 아래 merge job은 실행 안 됨
      - name: Build and Test
        run: ./gradlew test

  # 2번째 job: 테스트 통과 시 PR을 dev에 병합
  merge:
    needs: test                # 'test'가 성공해야만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull request
        # gh 명령어가 쓰는 토큰 (깃허브가 자동 발급)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 이번에 트리거된 PR 번호를 가져와서 병합 (--merge = 병합 커밋 방식)
        run: gh pr merge ${{ github.event.pull_request.number }} --merge